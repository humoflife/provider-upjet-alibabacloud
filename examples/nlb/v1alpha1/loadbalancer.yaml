apiVersion: nlb.alibabacloud.crossplane.io/v1alpha1
kind: LoadBalancer
metadata:
  annotations:
    meta.upbound.io/example-id: nlb/v1alpha1/loadbalancer
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    addressIpVersion: Ipv4
    addressType: Internet
    loadBalancerName: crossplane-example-nlb
    loadBalancerType: Network
    region: cn-beijing
    tags:
      Created: crossplane
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: nlb-loadbalancer
    zoneMappings:
    - vswitchIdSelector:
        matchLabels:
          testing.upbound.io/example-name: nlb-loadbalancer-1
      zoneIdSelector:
        matchLabels:
          testing.upbound.io/example-name: nlb-loadbalancer-1
    - vswitchIdSelector:
        matchLabels:
          testing.upbound.io/example-name: nlb-loadbalancer-2
      zoneIdSelector:
        matchLabels:
          testing.upbound.io/example-name: nlb-loadbalancer-2

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: VPC
metadata:
  annotations:
    meta.upbound.io/example-id: nlb/v1alpha1/loadbalancer
  labels:
    testing.upbound.io/example-name: nlb-loadbalancer
  name: nlb-loadbalancer
spec:
  forProvider:
    cidrBlock: 10.4.0.0/16
    region: cn-beijing
    vpcName: crossplane-example-nlb

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: nlb/v1alpha1/loadbalancer
  labels:
    testing.upbound.io/example-name: nlb-loadbalancer-1
  name: nlb-loadbalancer-1
spec:
  forProvider:
    cidrBlock: 10.4.1.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: nlb-loadbalancer
    vswitchName: crossplane-example-nlb_1
    zoneId: cn-beijing-f

---

apiVersion: vpc.alibabacloud.crossplane.io/v1alpha1
kind: Vswitch
metadata:
  annotations:
    meta.upbound.io/example-id: nlb/v1alpha1/loadbalancer
  labels:
    testing.upbound.io/example-name: nlb-loadbalancer-2
  name: nlb-loadbalancer-2
spec:
  forProvider:
    cidrBlock: 10.4.2.0/24
    region: cn-beijing
    vpcIdSelector:
      matchLabels:
        testing.upbound.io/example-name: nlb-loadbalancer
    vswitchName: crossplane-example-nlb_2
    zoneId: cn-beijing-g
