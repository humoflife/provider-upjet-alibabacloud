---
apiVersion: cr.alibabacloud.crossplane.io/v1alpha1
kind: EndpointACLPolicy
metadata:
  annotations:
    meta.crossplane.io/example-id: cr-v1alpha1-test-endpoint-acl-1
  labels:
    testing.crossplane.io/example-name: test-endpoint-acl-1
  name: test-endpoint-acl-1
spec:
  # NOTE: the target endpoint's ACL service must be enabled before an ACL
  # policy entry can persist (the "internet" endpoint is disabled by default).
  # Upstream exposes that only as the side-effecting Terraform data source
  # alicloud_cr_endpoint_acl_service (enable=true), which has no managed-resource
  # equivalent. In a Composition this is done by running that data source via
  # provider-terraform (Workspace) and managing this EndpointACLPolicy with this
  # provider, ordered enable -> policy. Because single-provider uptest cannot
  # perform the enable step, this example is excluded from the automated e2e
  # list, but the resource itself is valid and works when the endpoint is
  # enabled out-of-band.
  forProvider:
    region: us-west-1
    endpointType: internet
    entry: 192.168.1.0/24
    description: test-endpoint-acl-1
    instanceIdSelector:
      matchLabels:
        testing.crossplane.io/example-name: test-ee-instance-for-acl-1
    moduleName: Registry
---
apiVersion: cr.alibabacloud.crossplane.io/v1alpha1
kind: EeInstance
metadata:
  annotations:
    meta.crossplane.io/example-id: cr-v1alpha1-test-ee-instance-for-acl-1
  labels:
    testing.crossplane.io/example-name: test-ee-instance-for-acl-1
  name: test-ee-instance-for-acl-1
spec:
  forProvider:
    region: us-west-1
    instanceName: cr-ee-test-acl-2
    instanceType: Advanced
    paymentType: Subscription
    period: 1
    renewPeriod: 1
    renewalStatus: AutoRenewal
